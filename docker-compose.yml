services:
  postgres:
    image: postgres:16-alpine
    container_name: engiperf-pg
    environment:
      POSTGRES_USER: engiperf
      POSTGRES_PASSWORD: engiperf
      POSTGRES_DB: engiperf
    ports:
      - "5433:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U engiperf -d engiperf"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    container_name: engiperf-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@engiperf.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped